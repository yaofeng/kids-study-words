{{define "csrf"}}<input type="hidden" name="csrf_token" value="{{.CSRF}}">{{end}}

{{define "nav"}}
<nav class="app-nav" aria-label="主导航">
  <a href="/lookup" class="nav-link{{if eq .Active "lookup"}} is-active{{end}}">
    <span class="nav-icon" aria-hidden="true">🔎</span><span class="nav-label">查词</span>
  </a>
  <a href="/notebooks" class="nav-link{{if eq .Active "notebooks"}} is-active{{end}}">
    <span class="nav-icon" aria-hidden="true">📒</span><span class="nav-label">生词本</span>
  </a>
  <a href="/recall" class="nav-link{{if eq .Active "recall"}} is-active{{end}}">
    <span class="nav-icon" aria-hidden="true">🃏</span><span class="nav-label">回忆</span>
  </a>
  <a href="/records" class="nav-link{{if eq .Active "records"}} is-active{{end}}">
    <span class="nav-icon" aria-hidden="true">📅</span><span class="nav-label">记录</span>
  </a>
  <a href="/settings" class="nav-link{{if eq .Active "settings"}} is-active{{end}}">
    <span class="nav-icon" aria-hidden="true">⚙️</span><span class="nav-label">设置</span>
  </a>
</nav>
{{end}}

{{define "stars"}}<span class="stars" role="img" aria-label="{{StarLabel .}}">{{range Stars .}}<span class="star star-{{.Fill}}" aria-hidden="true"></span>{{end}}</span>{{end}}

  <circle cx="46" cy="58" r="5" fill="#3B3A36"/>
  <circle cx="74" cy="58" r="5" fill="#3B3A36"/>
