{{define "content"}}
<header class="page-head">
  <a class="back-link" href="/notebooks/{{.Notebook.ID}}">← {{.Notebook.Name}}</a>
  <div class="detail-head">
    <div>
      <h1 class="page-title">{{.Group.Name}}</h1>
      <p class="page-subtitle">{{.Group.WordCount}} 个单词</p>
    </div>
    <div class="detail-actions">
      <button class="btn" type="button" data-open-dialog="rename-group">改名</button>
      <form method="post" action="/notebooks/{{.Notebook.ID}}/groups/{{.Group.ID}}/delete">
        {{template "csrf" .}}
        <button class="btn btn-danger" type="submit" data-confirm="删除分组「{{.Group.Name}}」？单词不会被删除。">删除</button>
      </form>
    </div>
  </div>
</header>
<dialog class="modal" id="rename-group" aria-labelledby="rename-group-title">
  <form method="post" action="/notebooks/{{.Notebook.ID}}/groups/{{.Group.ID}}/rename" class="modal-body">
    {{template "csrf" .}}
    <h2 class="modal-title" id="rename-group-title">分组改名</h2>
    <label class="muted-text" for="rename-group-name">名称</label>
    <input class="input" id="rename-group-name" type="text" name="name" value="{{.Group.Name}}" maxlength="40" required>
    <div class="modal-actions">
      <button class="btn" type="button" data-close-dialog>取消</button>
      <button class="btn btn-primary" type="submit">保存名称</button>
    </div>
  </form>
</dialog>
{{if .Error}}<p class="alert alert-error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/notebooks/{{.Notebook.ID}}/groups/{{.Group.ID}}/words" class="group-words-form">
  {{template "csrf" .}}
  {{if .Words}}
  <ul class="group-word-list">
    {{range .Words}}
    <li class="card group-word-row">
      <label class="choice group-word-choice">
        <input type="checkbox" name="word_id" value="{{.Word.ID}}"{{if .Checked}} checked{{end}}>
        <span class="group-word-main">
          <span class="word-en">{{.Word.Word}}</span>
          {{if .Word.Phonetic}}<span class="word-phonetic">{{.Word.Phonetic}}</span>{{end}}
          <span class="word-translation">{{FirstLine .Word.Translation}}</span>
        </span>
        <span class="group-word-stars">{{template "stars" .Word.Proficiency}}</span>
      </label>
    </li>
    {{end}}
  </ul>
  <div class="group-save-bar">
    <button class="btn btn-primary btn-block" type="submit">保存</button>
  </div>
  {{else}}
  <p class="card empty-state">这个生词本还没有单词，先去<a class="link" href="/lookup">查词</a>加入吧。</p>
  {{end}}
</form>
{{end}}
