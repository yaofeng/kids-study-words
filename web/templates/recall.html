{{define "content"}}
<header class="page-head recall-head">
  <div>
    <h1 class="page-title">{{.Notebook.Name}}</h1>
    <p class="page-subtitle">只凭记忆，选一个答案。</p>
  </div>
  <form method="post" action="/recall/{{.Notebook.ID}}/end">
    {{template "csrf" .}}
    <button class="btn" type="submit">结束本轮</button>
  </form>
</header>

{{template "recall_card" .}}
{{end}}
